# Memory-constrained sandbox (cgroup ~1GB, no swap)
# Budget: hermes ~285MB + JVM(460 heap + 96 metaspace + 32 codecache + stacks) ≈ 900MB peak
# Phase 1 (precompile :gradle:compileKotlin) and Phase 2 (assembleRelease) run separately.
org.gradle.jvmargs=-Xmx460m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC -Xss512k
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx128m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
